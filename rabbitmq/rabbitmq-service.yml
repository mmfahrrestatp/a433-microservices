# Create RabbitMQ Service for RabbitMQ Statefulset
# - The type is ClusterIP not NodePort, if we want to access management ui from browser use kubectl port-forward

apiVersion: v1
kind: Service
metadata:
  labels:
    app: rabbitmq-svc
  name: rabbitmq-svc
spec:
  ports:
    - port: 5672
      targetPort: 5672 # used by AMQP 0-9-1 and AMQP 1.0 clients
      name: amqp
    - port: 15672
      targetPort: 15672 # management UI and HTTP API
      name: management-ui
  selector:
    app: rabbitmq-statefulset
  type: ClusterIP