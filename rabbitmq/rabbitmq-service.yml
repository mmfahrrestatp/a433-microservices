apiVersion: v1
kind: Service
metadata:
  labels:
    app: rabbitmq-svc
  name: rabbitmq-svc
spec:
  ports:
  - port: 5673
    targetPort: 5672 # used by AMQP 0-9-1 and AMQP 1.0 clients
    name: amqp
  - port: 15673
    targetPort: 15672 # management UI and HTTP API
    name: management-ui
    nodePort: 30072
  selector:
    app: rabbitmq-statefulset
  type: NodePort