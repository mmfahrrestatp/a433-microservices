apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-backend
  labels:
    app: karsajobs-backend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: karsajobs-backend
  template:
    metadata:
      labels:
        app: karsajobs-backend
    spec:
      containers:
      - name: karsajobs-backend
        image: ghcr.io/mmfahrrestatp/karsajobs:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8080
        env:
          - name: APP_PORT
            value: "8080"

          - name: MONGO_HOST
            value: mongodb://$(MONGO_SVC_SERVICE_HOST):$(MONGO_SVC_SERVICE_PORT_MONGO)

          - name: MONGO_USER
            valueFrom:
              secretKeyRef:
                name: mongo-cred
                key: MONGO_ROOT_USERNAME

          - name: MONGO_PASS
            valueFrom:
              secretKeyRef:
                name: mongo-cred
                key: MONGO_ROOT_PASSWORD
