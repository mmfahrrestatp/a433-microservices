apiVersion: apps/v1
kind: Deployment
metadata:
  name: karsajobs-frontend
  labels:
    app: karsajobs-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: karsajobs-frontend
  template:
    metadata:
      labels:
        app: karsajobs-frontend
    spec:
      containers:
      - name: karsajobs-frontend
        image: ghcr.io/mmfahrrestatp/karsajobs-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8000
        env:
          - name: VUE_APP_BACKEND
            # value: "http://karsajobs-backend:$(KARSAJOBS_BACKEND_SVC_SERVICE_PORT)"
            value: "http://192.168.49.2:30080"