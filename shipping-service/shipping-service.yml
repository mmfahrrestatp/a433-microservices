# Create shipping-svc for shipping-deployment
# - The type is ClusterIP, use port 3001 as instructed

apiVersion: v1
kind: Service
metadata:
  name: shipping-svc
  labels:
    app: shipping-svc
spec:
  ports:
  - port: 3001
    targetPort: 3001
  selector:
    app: shipping-deployment
  type: ClusterIP