# Create shipping-deployment
# - use image from public package that have been created
# - use port 3001 and edit AMQP_URL to use rabbitmq-svc DNS

apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-deployment
  labels:
    app: shipping-deployment

spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipping-deployment
  template:
    metadata:
      labels:
        app: shipping-deployment
      # To exclude shipping-deployment being injected by istio
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - name: shipping-deployment
        image: ghcr.io/mmfahrrestatp/shipping-service:latest
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 3001
        env:
          - name: AMQP_URL
            value: "amqp://rabbitmq-svc:5672"
          - name: PORT
            value: "3001"
